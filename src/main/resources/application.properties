spring.config.import=optional:file:.env[.properties]

spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/bootex}
spring.datasource.username=${DB_USERNAME:bootuser}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.format_sql=true
spring.jpa.show-sql=true

# S3
cloud.aws.region.static=${AWS_REGION}
cloud.aws.s3.bucket=${AWS_S3_BUCKET}
cloud.aws.stack.auto=false
spring.environment=local
spring.file-dir=/src/main/resources/static/files
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Google OAuth2
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Optional YouTube Data API fallback for an empty home feed
youtube.api-key=${YOUTUBE_API_KEY:}
